<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notificaciones – App Móvil</title>
<link rel="stylesheet" href="CSS/main.css">
<link rel="stylesheet" href="CSS/movil.css">
</head>
<body>

<div class="movil-fondo">
  <div class="telefono">
    <div class="movil-header">
      <div class="telefono-statusbar telefono-statusbar--claro">
        <span id="horaStatusBar">--:--</span>
        <span class="status-iconos">
          <svg width="15" height="11" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5c5-5 13-5 18 0M4 8c3.4-3.2 8.6-3.2 12 0M7.2 11c1.7-1.5 3.9-1.5 5.6 0"/><circle cx="10" cy="12.5" r="1"/></svg>
          <svg width="20" height="11" viewBox="0 0 25 13" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="20" height="11" rx="2.5"/><rect x="3" y="3" width="14" height="7" rx="1" fill="currentColor" stroke="none"/><path d="M23 4.5v4" stroke-linecap="round"/></svg>
        </span>
      </div>

      <div class="movil-header-fila">
        <button type="button" class="movil-header-campana-btn" onclick="notifMovilAtras()" title="Volver" aria-label="Volver">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="movil-header-titulos">
          <div class="movil-header-titulo">Notificaciones <span class="notif-panel-contador notif-titulo-contador" id="notifMovilContador"></span></div>
        </div>
      </div>
    </div>

    <div class="movil-contenido">
      <!-- Pantalla completa de notificaciones del inspector (no es un modal):
           lista con pestañas y, para los avisos agrupados, una vista de
           detalle dentro de la misma pantalla — ver notificaciones-movil.js. -->
      <div class="notif-pagina">
        <div id="notifMovilVistaLista">
          <div class="notif-panel-tabs">
            <button type="button" class="notif-panel-tab activa" data-filtro="todas" onclick="notifMovilCambiarFiltro('todas')">Todas</button>
            <button type="button" class="notif-panel-tab" data-filtro="no_leidas" onclick="notifMovilCambiarFiltro('no_leidas')">No leídas</button>
            <button type="button" class="notif-panel-marcar" id="notifMovilMarcarTodas" onclick="notifMovilMarcarTodas()">Marcar todas como leídas</button>
          </div>
          <div class="notif-panel-body" id="notifMovilBody"></div>
        </div>
      </div>
    </div>

    <div class="movil-bottomnav" id="movilBottomnav"></div>
  </div>
</div>

<script src="JS/data-usuarios.js"></script>
<script src="JS/data-tablas-generales.js"></script>
<script src="JS/data-terminal-muelle.js"></script>
<script src="JS/data-precintos.js"></script>
<script src="JS/data-movil.js"></script>
<script src="JS/data-gastos.js"></script>
<script src="JS/main.js"></script>
<script src="JS/nav-movil.js"></script>
<script src="JS/notificaciones-movil.js"></script>
<script>
  function actualizarHoraStatusBar() {
    const el = document.getElementById('horaStatusBar');
    if (!el) return;
    const ahora = new Date();
    const pad = n => String(n).padStart(2, '0');
    el.textContent = horaA12(`${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`);
  }
  actualizarHoraStatusBar();
  setInterval(actualizarHoraStatusBar, 15000);
  renderNavInferiorMovil('');
</script>
</body>
</html>
