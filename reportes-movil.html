<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes – App Móvil</title>
<link rel="stylesheet" href="CSS/main.css">
<link rel="stylesheet" href="CSS/movil.css">
</head>
<body>

<div class="movil-fondo">
  <div class="telefono">
    <div class="movil-header">
      <div class="telefono-statusbar telefono-statusbar--claro">
        <span id="horaStatusBar">--:--</span>
        <span class="status-iconos">
          <svg width="15" height="11" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5c5-5 13-5 18 0M4 8c3.4-3.2 8.6-3.2 12 0M7.2 11c1.7-1.5 3.9-1.5 5.6 0"/><circle cx="10" cy="12.5" r="1"/></svg>
          <svg width="20" height="11" viewBox="0 0 25 13" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="20" height="11" rx="2.5"/><rect x="3" y="3" width="14" height="7" rx="1" fill="currentColor" stroke="none"/><path d="M23 4.5v4" stroke-linecap="round"/></svg>
        </span>
      </div>
      <div class="movil-header-fila">
        <div class="movil-header-titulos">
          <div class="movil-header-titulo">Reportes</div>
        </div>
      </div>
    </div>

    <div class="movil-contenido">

      <!-- TARJETA DE PERÍODO — mismos ids/markup que "Generación de
           Reporte" (gastos-movil.html), para que las 2 pantallas se vean
           consistentes; inicializarGastosMovil (gastos-movil.js) los llena
           igual acá, ya corre en ambas páginas. -->
      <div class="gastos-periodo-card">
        <div class="gastos-periodo-card-top gastos-periodo-nav">
          <button type="button" class="gastos-periodo-flecha" id="btnPeriodoAnterior" onclick="cambiarPeriodoGastos(-1)" title="Período anterior" aria-label="Período anterior">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="gastos-periodo-card-centro">
            <span class="gastos-periodo-card-nombre" id="gastosPeriodoNombre">—</span>
            <span class="gastos-periodo-card-rango" id="gastosPeriodoRango">—</span>
          </div>
          <button type="button" class="gastos-periodo-flecha" id="btnPeriodoSiguiente" onclick="cambiarPeriodoGastos(1)" title="Período siguiente" aria-label="Período siguiente">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="gastos-periodo-card-resumen">
          <div class="gastos-periodo-card-resumen-item total">
            <span>Total acumulado</span>
            <strong id="gastosResumenTotal">S/ 0.00</strong>
          </div>
          <div class="gastos-periodo-card-resumen-item">
            <span>Jornadas registradas</span>
            <strong id="gastosResumenJornadas">0</strong>
          </div>
          <div class="gastos-periodo-card-resumen-item">
            <span>Alimentos</span>
            <strong id="gastosResumenAlimentos">S/ 0.00</strong>
          </div>
          <div class="gastos-periodo-card-resumen-item">
            <span>Movilidad</span>
            <strong id="gastosResumenMovilidad">S/ 0.00</strong>
          </div>
          <div class="gastos-periodo-card-resumen-item">
            <span>Días a Bordo</span>
            <strong id="gastosResumenDiasBordo">S/ 0.00</strong>
          </div>
        </div>
      </div>

      <!-- FILTROS (§5): búsqueda por código/PER/cliente, rango de fechas,
           chips de tipo (incl. "Todos") y orden. -->
      <div class="reportes-filtros">
        <input type="search" class="movil-input" id="reportesBusqueda" placeholder="Buscar por código, PER o cliente…" style="padding-left:14px;" oninput="actualizarFiltrosReportes()">
        <!-- Período y fecha en una misma fila. Período: los períodos (10→09) con jornadas; cambia todo el módulo, igual que las flechas de arriba. Fecha: una sola, dentro del período (vacía = todas). -->
        <div class="reportes-filtros-fecha">
          <select class="movil-input" id="reportesPeriodo" style="padding-left:14px;" onchange="elegirPeriodoReportes(this.value)" aria-label="Período"></select>
          <input type="date" class="movil-input" id="reportesFecha" style="padding-left:14px;" aria-label="Fecha" onchange="actualizarFiltrosReportes()">
        </div>
        <div class="movil-tab-toggle" id="reportesTabs">
          <button type="button" class="movil-tab-toggle-btn activo" id="btnTabReportesTodos" onclick="cambiarTabReportes('Todos')">Todos</button>
          <button type="button" class="movil-tab-toggle-btn" id="btnTabReportesMovilidad" onclick="cambiarTabReportes('Movilidad')">Movilidad</button>
          <button type="button" class="movil-tab-toggle-btn" id="btnTabReportesAlimentos" onclick="cambiarTabReportes('Alimentos')">Alimentos</button>
          <button type="button" class="movil-tab-toggle-btn" id="btnTabReportesDiasBordo" onclick="cambiarTabReportes('Días a Bordo')">Días a Bordo</button>
        </div>
        <div class="reportes-filtros-acciones">
          <span class="reportes-contador" id="reportesContador"></span>
          <button type="button" class="btn-accion btn-cancelar" style="height:28px;font-size:10px;" onclick="cambiarOrdenReportes()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M6 12h12M10 17h4"/></svg>
            <span id="reportesOrdenTexto">Más recientes</span>
          </button>
        </div>
      </div>

      <div id="reportesAccordion"></div>
      <p class="gastos-total-acumulado" id="reportesTotalGeneral"></p>
    </div>

    <div class="movil-bottomnav" id="movilBottomnav"></div>

    <!-- MODAL: DETALLE DE UN REPORTE — todos los registros de un tipo
         (Alimentos / Movilidad / Días a Bordo) de una jornada. Solo consulta. -->
    <div class="modal-overlay movil-modal-overlay" id="modalDetalleReporte">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div>
            <h2 class="modal-title" id="detalleReporteTitulo">Reporte</h2>
            <span class="detalle-reg-sub" id="detalleReporteSub"></span>
          </div>
          <button class="modal-close" onclick="cerrarModal('modalDetalleReporte')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div id="detalleReporteLista"></div>
        </div>
        <div class="modal-footer detalle-reg-pie">
          <strong id="detalleReporteTotal">Total: S/ 0.00</strong>
          <button class="btn-accion btn-cancelar" onclick="cerrarModal('modalDetalleReporte')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            Cerrar
          </button>
        </div>
      </div>
    </div>

    <!-- MODAL: VALIDAR HUELLA — simulado (igual que la geolocalización
         simulada de Operaciones): sin hardware real, solo un estado de
         carga breve antes de confirmar. -->
    <div class="modal-overlay movil-modal-overlay" id="modalValidarHuella">
      <div class="modal modal-sm">
        <div class="modal-body modal-huella-body">
          <div class="huella-icono" id="huellaIcono">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 11c0 3.5-1.5 6.5-3 8.5M6.5 18c1-2 1.5-4 1.5-6a4 4 0 0 1 8 0c0 1 0 2-.5 3.5M9 20.5a16 16 0 0 0 1.5-6.5 1.5 1.5 0 0 1 3 0c0 2-.5 4-1 5.5M12.5 6.5a7 7 0 0 1 7 7c0 1.5-.2 2.5-.5 3.5M4.5 15a9 9 0 0 1 .5-8.5M8 4.2A9 9 0 0 1 21 11.5"/></svg>
          </div>
          <p class="huella-texto" id="huellaEstadoTexto">Coloca tu huella en el sensor…</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="JS/data-usuarios.js"></script>
<script src="JS/data-tablas-generales.js"></script>
<script src="JS/data-terminal-muelle.js"></script>
<script src="JS/data-precintos.js"></script>
<script src="JS/data-movil.js"></script>
<script src="JS/data-documentos-movil.js"></script>
<script src="JS/data-gastos.js"></script>
<script src="JS/permisos.js"></script>
<script src="JS/main.js"></script>
<script src="JS/nav-movil.js"></script>
<script src="JS/notificaciones-movil.js"></script>
<script src="JS/descarga-gastos.js"></script>
<script src="JS/gastos-movil.js"></script>
<script>renderNavInferiorMovil('reportes');</script>
</body>
</html>
